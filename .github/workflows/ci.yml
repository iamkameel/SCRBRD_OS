# SCRBRD — continuous integration
#
# Until this file existed, nothing ran automatically. The suites were real —
# 926 unit assertions and 745 across twenty API walks — and they only ever ran
# because somebody typed the command. PR #1 carried fifty-two commits and forty
# thousand lines toward `main` with zero checks against it, which meant "CI is
# green" was a statement about nothing.
#
# That is the same shape as the defects those suites keep catching: a control
# that exists, passes, and never runs. The toss shipped with its RLS policies
# in a generated file and survived exactly as long as nobody regenerated;
# smoke-squad sat un-executed for a week after it was written. Both were found
# by hand. Neither should have needed to be.
#
# Three jobs, deliberately separate, so a failure says which layer broke rather
# than "CI failed":
#
#   unit     — pure logic. No database, no browser. Fastest signal.
#   walks    — the API against a real Postgres with RLS enforced. Cut into
#              four shards that run side by side (see "API walks" below).
#   browser  — the client rendering real rows in real Chromium. Cut into four
#              shards that run side by side (see "Browser walks" below).
#
# Beside them, "RLS verifier" runs db/99 once against a database built from
# nothing. Both "API walks" and "Browser walks" wait for it and fail when it
# fails, as they did when each walk job ran the verifier itself.
#
# They run in parallel; none gates another. A broken browser install must not
# hide a failing authorisation test.
name: CI

on:
  # Pushes run CI on main only (Kameel, 30 Oct). A PR's own pull_request run
  # checks every commit pushed to its branch, so a second run for the same
  # commit only queued behind the first. Branches with no PR are proved
  # locally by their builders and by CI once their PR opens.
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first. The old run is telling you about a commit
# nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# DELIBERATELY NO job-wide DATABASE_URL.
#
# There are TWO connections here and they must not be the same role. Migrations
# run as `scrbrd`, which owns the schema; the API runs as `scrbrd_app`, which
# does not and cannot bypass row-level security. Both defaults already point at
# this service container, so setting nothing is also setting it correctly.
#
# Setting it once at job level broke every walk that spawns the API. In the
# postgres image POSTGRES_USER is created a SUPERUSER, so the spawned server
# inherited a superuser URL, and server.mjs refused to start — "it is a
# SUPERUSER" — because every policy would have been inert for it. Eighteen
# walks reported `fetch failed`; the only two that passed were the two that
# never spawn a server. The guard was right and the workflow was wrong.
#
# It did not reproduce locally because the `scrbrd` role on a developer machine
# is not a superuser. Only a fresh service container makes it one.

jobs:
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field names
      # the exact pnpm, and action-setup@v4 REFUSES to run when both are set —
      # "Multiple versions of pnpm specified". That refusal was every CI job
      # on main dying at step 3, in twenty seconds, since packageManager was
      # added. Green was a statement about nothing for six merges.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # package.json engines says >=22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # TypeScript as a checker over the JavaScript — nothing is compiled.
      # Zero errors across tsconfig.json's `include`, the strict list, which
      # tools/typecheck-scope.test.mjs lets grow and never shrink.
      - name: Typecheck
        run: pnpm typecheck

      # Bug-shaped rules only: undefined names, duplicate keys, loose equality,
      # the rules of hooks. Errors fail; warnings are the cleanup queue.
      - name: Lint
        run: pnpm lint

      # Authorisation, scoring, the design system, the rubric, the client's
      # RBAC copy. No services, so this is the signal that arrives first.
      - name: Tests
        run: pnpm test

      # data/mock.js may be imported by exactly one module. A view that reaches
      # around the choke point renders correctly and has skipped every scoping
      # and masking rule on the way.
      - name: Import boundaries
        run: pnpm check:imports

      # docs/pilot quotes the app's buttons in bold; a renamed button fails here.
      - name: Pilot documents
        run: pnpm check:pilot-docs

      - name: Build
        run: pnpm build

      # Runs against the BUILT client, which is why it lives after the build
      # and not with the unit suites. It fails if the rewards algorithm's
      # coefficients — or their names, which describe the shape of it — are
      # reachable from anything the browser downloads.
      - name: Nothing confidential in the bundle
        run: pnpm check:bundle

  # The API walks, four shards at a time, as the browser walks below. In one job
  # they and the verifier took 3 h 40 min (29 Oct 2026, run 40890874044): the
  # verifier preamble 90 min, 106 walks 40 min, the Verifier step 89 min more.
  # The walks share nothing but the code under test, so each shard has its own
  # runner and its own Postgres service container. `--shard i/4` gives each a
  # fixed slice weighted by API_WEIGHTS in tools/run-smoke-api.mjs, and
  # tools/run-smoke-shard.test.mjs (in `pnpm test`, so in "Unit suites") holds
  # every walk to exactly one shard and the two sets to every walk on disk; the
  # runner itself still refuses to start if a smoke walk exists that no set
  # names. To change the count, change the matrix AND the `/4` in the job name,
  # the walks step and the summary's message.
  #
  # `--no-rls-verify`: db/99 runs once, in "RLS verifier", not once per shard.
  #
  # fail-fast is off on purpose: one red shard must not cancel the other three.
  api-shard:
    name: API walks (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # The version docker-compose.yml pins. RLS behaviour is the thing under
      # test here, so the major version is not a detail to leave floating.
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: scrbrd
          POSTGRES_PASSWORD: scrbrd
          POSTGRES_DB: scrbrd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrbrd -d scrbrd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field names
      # the exact pnpm, and action-setup@v4 REFUSES to run when both are set —
      # "Multiple versions of pnpm specified". That refusal was every CI job
      # on main dying at step 3, in twenty seconds, since packageManager was
      # added. Green was a statement about nothing for six merges.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tools/migrate.mjs shells out to psql rather than using a driver, so the
      # client is a real dependency of the migration path, not a convenience.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client


      # Each walk against a freshly seeded database. The runner resets between
      # them and refuses to start if a smoke walk exists on disk that nothing
      # executes — which is how smoke-squad went unrun for a week. The browser
      # walks have their own job: they need a built client and a Chromium.
      - name: Walks (shard ${{ matrix.shard }}/4)
        run: node tools/run-smoke-api.mjs --shard ${{ matrix.shard }}/4 --no-rls-verify

  # The live policy assertions, db/99, against a database built by the migrator
  # from nothing — the same file the Supabase verify bundle is cut from. Its own
  # job so it runs beside the walks instead of after them; it is the longest
  # single thing CI does (about 90 min on a runner, 29 Oct 2026).
  verifier:
    name: RLS verifier
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: scrbrd
          POSTGRES_PASSWORD: scrbrd
          POSTGRES_DB: scrbrd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrbrd -d scrbrd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field names
      # the exact pnpm (see the unit job).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verifier
        run: node tools/migrate.mjs --reset --seed && node tools/migrate.mjs --verify

      # Policy is generated from packages/policy/. A hand-edit to the generated
      # file survives until someone regenerates and then silently disappears,
      # which is exactly how match_toss lost row-level security. If regenerating
      # changes anything, the committed output is stale. Reported even when
      # the verifier failed, so one red step does not hide the other.
      - name: RLS output is current
        if: ${{ !cancelled() }}
        run: |
          pnpm rls:generate
          git diff --exit-code db/01_authz.sql db/09_rls_policies.sql db/23_authz_time_box.sql db/35_authz_suspension.sql db/39_match_anchor_helpers.sql \
            || { echo "::error::db/01_authz.sql, db/09_rls_policies.sql, db/23_authz_time_box.sql, db/35_authz_suspension.sql or db/39_match_anchor_helpers.sql is stale — run 'pnpm rls:generate' and commit the result"; exit 1; }

  # The one check that stands for the four API shards and the verifier. Branch
  # protection and our tooling know a check called exactly "API walks", which
  # was the single job that ran the walks, the verifier and the RLS output
  # check; it fails now exactly when that job would have. `if: always()` so it
  # reports when a shard failed or was cancelled instead of showing as
  # skipped. Anything but success from any of them fails it.
  walks:
    name: API walks
    needs: [api-shard, verifier]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and the verifier passed
        env:
          SHARDS: ${{ needs.api-shard.result }}
          VERIFIER: ${{ needs.verifier.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::API walks: the shards finished as '$SHARDS', not 'success'"
            exit 1
          fi
          if [ "$VERIFIER" != "success" ]; then
            echo "::error::API walks: the RLS verifier finished as '$VERIFIER', not 'success'"
            exit 1
          fi
          echo "All four API shards and the RLS verifier passed."

  image:
    name: Production image
    runs-on: ubuntu-latest
    # The image was only ever built by the deploy, after a merge to main, so
    # a Dockerfile or .dockerignore that broke it failed the deploy rather
    # than the PR (found 2026-09-27: tools/db-url.mjs was copied in while
    # .dockerignore excluded tools/, and the server read its database from a
    # helper that ignored DATABASE_URL). This builds the image exactly as the
    # deploy does, then boots it the way Cloud Run does — production mode,
    # DATABASE_URL naming the application role, SESSION_SECRET set — against
    # a migrated database, and asks /api/health whether it reached it.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: scrbrd
          POSTGRES_PASSWORD: scrbrd
          POSTGRES_DB: scrbrd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrbrd -d scrbrd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field names
      # the exact pnpm (see the walks job).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # The server refuses to start on a database missing a migration it was
      # built against (SCRBRD-066), so the schema goes on first, as the owner.
      - name: Migrate
        run: node tools/migrate.mjs --reset --seed

      # The Dockerfile's base, fetched from Google's Docker Hub mirror and
      # tagged under its Docker Hub name, so the build finds it locally rather
      # than asking Docker Hub, which rate-limits these runners. The
      # Dockerfile itself, and so Render's build, is unchanged.
      # A mirror can refuse an anonymous pull for a moment (ECR did, 9 and
      # 12 Oct, before CI moved here): a refused pull waits and tries again,
      # up to five times, before the job fails.
      - name: Fetch the base image from the mirror
        run: |
          for try in 1 2 3 4 5; do
            docker pull mirror.gcr.io/library/node:22-alpine && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 5))
          done
          docker tag mirror.gcr.io/library/node:22-alpine node:22-alpine

      - name: Build the image
        run: docker build -t scrbrd-api:ci .

      - name: Boot it as Cloud Run does, and reach the database
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production \
            -e PORT=8787 \
            -e DATABASE_URL=postgres://scrbrd_app:scrbrd_app@127.0.0.1:5432/scrbrd \
            -e SESSION_SECRET=ci-only-not-a-secret \
            -e WEB_ORIGIN=http://localhost:5173 \
            scrbrd-api:ci
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::the production image exited on start"; docker logs api; exit 1
            fi
            body=$(curl -fsS http://127.0.0.1:8787/api/health || true)
            if echo "$body" | grep -q '"db":"ok"'; then echo "$body"; docker logs api | tail -5; exit 0; fi
            sleep 1
          done
          echo "::error::/api/health never reported db ok"; echo "$body"; docker logs api; exit 1

  # The browser walks, four shards at a time. Run one after another in one job
  # they took most of an hour and decided how long every push waited; the walks
  # share nothing but the code under test (each shard has its own runner, its
  # own Postgres service container and its own build), so they can be split
  # freely. `run-smoke-api.mjs --shard i/n` gives each shard a fixed, weighted
  # slice of the list, and its unit test (tools/run-smoke-shard.test.mjs) holds
  # every walk to exactly one shard. To change the count, change the matrix
  # AND the `/4` in the job name and the walks step.
  #
  # fail-fast is off on purpose: one red shard must not cancel the other three,
  # or the first run tells you about one failure and hides the rest.
  browser-shard:
    name: Browser walks (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: scrbrd
          POSTGRES_PASSWORD: scrbrd
          POSTGRES_DB: scrbrd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrbrd -d scrbrd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field names
      # the exact pnpm, and action-setup@v4 REFUSES to run when both are set —
      # "Multiple versions of pnpm specified". That refusal was every CI job
      # on main dying at step 3, in twenty seconds, since packageManager was
      # added. Green was a statement about nothing for six merges.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client


      # The repo depends on playwright-core, which drives a browser but does not
      # download one. The full package is pulled in here only to fetch Chromium
      # and its system libraries; tools/chromium.mjs then finds it through
      # PLAYWRIGHT_BROWSERS_PATH without any path hard-coded in a walk.
      - name: Install Chromium
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      # The walks serve apps/web/dist, so it has to exist. Locally it survives
      # from a previous build and the need is invisible; on a clean runner the
      # first CI run died on a missing dist/index.html.
      - name: Build the client
        run: pnpm build

      - name: Nothing confidential in the bundle
        run: pnpm check:bundle

      # Proves the CLIENT renders the rows the API returned — that no view is
      # still filtering a mock in the browser, and that a guardian's screen
      # contains their own child and nobody else's. A view can read through a
      # correct API and still show mock data; only a browser catches that.
      # `--no-rls-verify`: db/99 runs once, in "RLS verifier", which the
      # "Browser walks" check also waits for. Each shard used to run it first,
      # 52 to 91 minutes of every shard (29 Oct 2026).
      - name: Client against the API (shard ${{ matrix.shard }}/4)
        run: node tools/run-smoke-api.mjs --browser --shard ${{ matrix.shard }}/4 --no-rls-verify

      # Rendering, the scoring pad, persistence and the accessibility floor.
      # No database between them, so they run as one step. Once, on the first
      # shard, which is the one with the fewest walks.
      - name: Client on its own
        if: ${{ matrix.shard == 1 }}
        run: pnpm smoke

  # The one check that stands for all four shards. Branch protection and our
  # tooling look for a check called exactly "Browser walks"; the matrix jobs
  # are named "Browser walks (i/4)" and would never satisfy it. `if: always()`
  # so it still reports when a shard failed or was cancelled, instead of
  # showing as skipped, which a required check reads as passing or as missing
  # depending on the setting. Anything but success from the shards fails it.
  # It also waits for the RLS verifier, which each shard used to run first and
  # fail on, so a broken policy still turns this check red.
  browser:
    name: Browser walks
    needs: [browser-shard, verifier]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.browser-shard.result }}
          VERIFIER: ${{ needs.verifier.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::Browser walks: the shards finished as '$SHARDS', not 'success'"
            exit 1
          fi
          if [ "$VERIFIER" != "success" ]; then
            echo "::error::Browser walks: the RLS verifier finished as '$VERIFIER', not 'success'"
            exit 1
          fi
          echo "All four browser shards and the RLS verifier passed."
