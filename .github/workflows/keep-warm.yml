name: Keep warm (match hours)

# Render's free plan stops the service after about fifteen minutes without a
# request, and the next person waits thirty to sixty seconds while it boots.
# On a Saturday morning that person is the scorer opening the pad, or a parent
# opening the live page. The pad's outbox keeps every ball safe once scoring
# has begun, but signing in and claiming the match wait on the boot.
#
# So this pings /api/health through school cricket's hours only, not all day:
#   weekdays  12:00–18:50 SAST (10:00–16:50 UTC)
#   Saturday  06:00–18:50 SAST (04:00–16:50 UTC)
# about 170 instance-hours a month, well inside Render's 750. /api/health runs
# `select 1`, which also keeps a free Supabase project from pausing for want
# of use. GitHub runs a schedule when it can, sometimes minutes late; every
# ten minutes leaves room for that inside Render's fifteen.
#
# The address is the repository variable SCRBRD_HEALTH_URL (Settings → Secrets
# and variables → Actions → Variables), e.g. https://scrbrd.onrender.com/api/health.
# Unset, the job says so and does nothing. Schedules run from the default
# branch only, so this starts once it is on main.
#
# It is also the pilot's only alert (incidents design, P9). A failed run makes
# GitHub email the repository owner, so the job fails when production is bad:
# no answer, an answer other than 200, a body that is not JSON, or a body that
# does not say ok:true with db:"ok". A sleeping server gets up to three
# attempts, 75 seconds each with a 20 second pause, before that counts. If the
# body carries audit_failed (not there yet), a value above 0 fails it too.

on:
  schedule:
    - cron: '*/10 10-16 * * 1-5'
    - cron: '*/10 4-16 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Three attempts at 75 seconds and two pauses of 20 is 265 seconds.
    timeout-minutes: 6
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.SCRBRD_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::SCRBRD_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          # A cold start is the case this exists for: Render's free plan takes
          # thirty to sixty seconds to boot, and may answer 502 or 503 meanwhile.
          # So a bad first answer is retried before it counts. The three knobs
          # have defaults here and are overridden only to test this script.
          attempts=${ATTEMPTS:-3}
          max_time=${MAX_TIME:-75}
          pause=${PAUSE:-20}
          body=$(mktemp)
          reason=""
          n=1
          while [ "$n" -le "$attempts" ]; do
            code=$(curl --silent --output "$body" --write-out '%{http_code}' --max-time "$max_time" "$URL") || code=000
            if [ "$code" = "000" ]; then
              reason="got no answer (unreachable, or no reply within ${max_time}s)"
            elif [ "$code" != "200" ]; then
              reason="answered HTTP $code, not 200"
            elif ! jq -e . "$body" >/dev/null 2>&1; then
              reason="answered 200 with a body that is not JSON"
            elif ! jq -e '.ok == true and .db == "ok"' "$body" >/dev/null 2>&1; then
              reason="reports itself unhealthy (ok=$(jq -r '.ok' "$body"), db=$(jq -r '.db' "$body"))"
            elif ! jq -e '(.audit_failed // 0) == 0' "$body" >/dev/null 2>&1; then
              reason="reports failed audit-log writes (audit_failed=$(jq -r '.audit_failed' "$body"))"
            else
              echo "GET /api/health -> 200, ok, attempt $n of $attempts"
              exit 0
            fi
            echo "GET /api/health attempt $n of $attempts: $reason"
            if [ "$n" -lt "$attempts" ]; then sleep "$pause"; fi
            n=$((n + 1))
          done
          # One line for the email. The path only, never the address or a body.
          echo "::error title=Production health check failed::GET /api/health $reason, after $attempts attempts"
          exit 1
